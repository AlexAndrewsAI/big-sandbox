services:
  sandbox:
    image: alexandrewsai/big-sandbox:latest
    build:
      context: .
    environment:
      - DISPLAY=:1
      - HOME=/persist
      - PATH=/home/sandbox/.local/bin:/persist/.local/bin:/usr/local/bin:/usr/bin:/bin:/home/sandbox/node_modules/cline/bin
    ports:
      # VNC desktop access (traditional VNC client)
      - "5901:5901"
    volumes:
      # ┌─────────────────────────────────────────────────────────┐
      # │  ADD YOUR MOUNTS HERE                                   │
      # │  Adjust to include other folders in the                 │
      # │  sandbox, e.g.:                                         │
      # │    - ./workspace:/workspace                             │
      # │    - ~/data:/data                                       │
      # └─────────────────────────────────────────────────────────┘
      - ./persist:/persist
    devices:
      # FUSE device for gocryptfs and other FUSE filesystems
      - /dev/fuse
    cap_add:
      # Required for FUSE mounts inside the container
      - SYS_ADMIN
    tty: true
    stdin_open: true
